<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Multi Nation Input Preview</title>
    <style>
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: #f3f4f6;
      }

      #root {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        box-sizing: border-box;
      }

      .card {
        width: 100%;
        max-width: 420px;
        background: #fff;
        border-radius: 16px;
        padding: 24px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      }

      h1 {
        margin: 0 0 8px;
        font-size: 24px;
      }

      p {
        margin: 0 0 20px;
        color: #6b7280;
      }

      .result {
        margin-top: 16px;
        padding: 12px;
        border-radius: 10px;
        background: #f9fafb;
        font-size: 14px;
        color: #111827;
        word-break: break-word;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <p style="text-align: center; color: #6b7280; padding-bottom: 24px;">
      Open this file in a React Native Web app to preview the component.
    </p>
  </body>
</html>
